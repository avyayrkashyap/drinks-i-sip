<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drinks I Sip</title>
<meta name="description" content="A shelf of drinks I've had, drawn one cup at a time.">
<style>
  :root{
    --ink:#1a1414;
    --muted:#8b7f7c;
    --line:#e8e2df;
    --cocoa:#5c2222;
    --bg:#fbf9f7;
    --max:1100px;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font:16px/1.6 ui-serif,Georgia,"Iowan Old Style","Times New Roman",serif;
  }
  .wrap{max-width:var(--max);margin:0 auto;padding:0 24px}

  header{padding:88px 0 40px}
  h1{
    font-size:clamp(38px,7vw,64px);
    line-height:1.02;
    margin:0 0 18px;
    letter-spacing:-.02em;
    font-weight:600;
  }
  .tagline{margin:0;max-width:46ch;color:var(--muted);font-size:17px}

  /* tools: shuffle + sort */
  .tools{display:flex;flex-wrap:wrap;gap:10px;padding:26px 0 0}
  .tool{
    display:inline-flex;align-items:center;gap:8px;
    font:inherit;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:1px solid var(--line);border-radius:999px;
    padding:8px 16px;color:var(--muted);cursor:pointer;
    transition:.15s ease;
  }
  .tool:hover{color:var(--ink);border-color:#d3c9c5}
  .tool:focus-visible{outline:2px solid var(--cocoa);outline-offset:3px}
  .tool[aria-pressed="true"]{background:var(--cocoa);border-color:var(--cocoa);color:#fff}
  .tool svg{width:17px;height:17px;fill:currentColor;flex-shrink:0}
  /* nudge the shuffle arrows on press */
  .tool:active svg{transform:scale(.9)}

  /* filters */
  nav{
    display:flex;flex-wrap:wrap;gap:8px;
    padding:36px 0 8px;
    border-bottom:1px solid var(--line);
  }
  .filter{
    font:inherit;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    background:none;border:1px solid var(--line);border-radius:999px;
    padding:7px 15px;color:var(--muted);cursor:pointer;
    transition:.15s ease;
  }
  .filter:hover{color:var(--ink);border-color:#d3c9c5}
  .filter[aria-pressed="true"]{background:var(--cocoa);border-color:var(--cocoa);color:#fff}
  .count{margin:14px 0 0;font-size:13px;color:var(--muted);letter-spacing:.04em}

  /* shelf */
  .shelf{
    list-style:none;margin:0;padding:44px 0 0;
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
    gap:52px 28px;
  }
  .cup{margin:0;text-align:center}
  .cup figure{margin:0}

  /* the whole cup is the button */
  .cupbtn{
    display:block;width:100%;
    background:none;border:0;padding:0;margin:0;
    font:inherit;color:inherit;text-align:center;cursor:pointer;
    border-radius:10px;
  }
  .cupbtn:focus-visible{outline:2px solid var(--cocoa);outline-offset:6px}

  .cup img{
    display:block;width:100%;height:210px;object-fit:contain;
    mix-blend-mode:multiply;
    transition:transform .25s ease;
  }
  .cupbtn:hover img{transform:translateY(-6px) rotate(-1.2deg)}
  .cupbtn[aria-expanded="true"] img{transform:translateY(-6px)}
  figcaption{margin-top:14px}
  .place{display:block;font-size:17px;letter-spacing:-.01em}
  .meta{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
  .rank{
    display:inline-block;margin-top:7px;
    font-size:11px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--cocoa);border:1px solid #e3d2d2;border-radius:999px;padding:3px 9px;
  }
  .addr{
    overflow:hidden;
    display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .28s ease;
  }
  .cup.open .addr{grid-template-rows:1fr}
  .addr > div{min-height:0}
  .addr p{
    margin:12px auto 0;max-width:24ch;
    font-size:13.5px;line-height:1.5;color:var(--muted);
    font-style:normal;
  }
  .addr a{color:var(--cocoa);text-decoration:none;border-bottom:1px solid #e3d2d2}
  .addr a:hover{border-bottom-color:var(--cocoa)}

  .note{margin:8px auto 0;max-width:26ch;font-size:13.5px;color:var(--muted);font-style:italic}

  footer{
    margin-top:96px;padding:26px 0 60px;border-top:1px solid var(--line);
    font-size:13px;color:var(--muted);
  }
  footer a{color:var(--muted)}

  @media (max-width:520px){
    header{padding:56px 0 28px}
    .shelf{gap:40px 20px;grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
    .cup img{height:160px}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Drinks I Sip</h1>
    <p class="tagline">My digital shelf of some cups and glasses I&rsquo;ve liked enough to draw &mdash; presented in no particular order.</p>
  </header>

  <div class="tools">
    <button class="tool" id="shuffle" type="button" aria-pressed="false">
      <!-- Material Icons: shuffle -->
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
      Shuffle
    </button>
    <button class="tool" id="sort" type="button" aria-pressed="false">
      <!-- Material Icons: arrow_upward / arrow_downward -->
      <svg id="sortIcon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z"/></svg>
      <span id="sortLabel">A&ndash;Z</span>
    </button>
  </div>

  <nav id="filters" aria-label="Filter by kind of drink"></nav>
  <p class="count" id="count"></p>

  <ul class="shelf" id="shelf"></ul>

  <footer>
    <p>Drawn and kept by me. More cups as I drink them.</p>
  </footer>

</div>

<script>
/* ------------------------------------------------------------------
   THE LIST. Add a drink by copying one block.

   image  – file in assets/
   place  – where you had it
   drink  – what it was
   kind   – "Hot Chocolate" | "Coffee" | "Cocktail" | "Beer" | ...
            (filter buttons build themselves from these)
   city   – optional, "" hides it
   address– street address, revealed when the cup is clicked
   rank   – optional number, your ranking within its kind. null hides it
   note   – optional one line. "" hides it
------------------------------------------------------------------- */
const DRINKS = [
  {
    image: "assets/caffe-panna.png",
    place: "Caffè Panna",
    address: "77 Irving Pl, New York, NY 10003",
    drink: "Hot Chocolate",
    kind:  "Hot Chocolate",
    city:  "",
    rank:  null,
    note:  ""
  },
  {
    image: "assets/the-cocoa-store.png",
    place: "The Cocoa Store",
    address: "873 Broadway, 6th floor, New York, NY 10003",
    drink: "Hot Chocolate",
    kind:  "Hot Chocolate",
    city:  "",
    rank:  null,
    note:  ""
  },
  {
    image: "assets/amorino.png",
    place: "Amorino",
    address: "721 8th Ave, New York, NY 10036",
    drink: "Hot Chocolate",
    kind:  "Hot Chocolate",
    city:  "",
    rank:  null,
    note:  ""
  },
  {
    image: "assets/breads-bakery.png",
    place: "Breads Bakery",
    address: "18 E 16th St, New York, NY 10003",
    drink: "Hot Chocolate",
    kind:  "Hot Chocolate",
    city:  "",
    rank:  null,
    note:  ""
  }
];

const shelf   = document.getElementById("shelf");
const filters = document.getElementById("filters");
const countEl = document.getElementById("count");
let active = "All";
let order  = "default";        // "default" | "shuffle" | "asc" | "desc"
let bag    = [];               // shuffled sequence of indices into DRINKS
const opened = new Set();      // places whose address is showing, kept across re-sorts

const kinds = ["All", ...new Set(DRINKS.map(d => d.kind))];

kinds.forEach(kind => {
  const b = document.createElement("button");
  b.className = "filter";
  b.type = "button";
  b.textContent = kind;
  b.setAttribute("aria-pressed", String(kind === active));
  b.addEventListener("click", () => {
    active = kind;
    [...filters.children].forEach(c =>
      c.setAttribute("aria-pressed", String(c.textContent === kind))
    );
    render();
  });
  filters.appendChild(b);
});

const shuffleBtn = document.getElementById("shuffle");
const sortBtn    = document.getElementById("sort");
const sortLabel  = document.getElementById("sortLabel");
const sortIcon   = document.getElementById("sortIcon");

const ARROW_UP   = "M4 12l1.41 1.41L11 7.83V20h2V7.83l5.58 5.59L20 12l-8-8-8 8z";
const ARROW_DOWN = "M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z";

shuffleBtn.addEventListener("click", () => {
  // Fisher-Yates over the indices, so every cup can land anywhere
  bag = DRINKS.map((_, i) => i);
  for (let i = bag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [bag[i], bag[j]] = [bag[j], bag[i]];
  }
  order = "shuffle";
  syncTools();
  render();
});

sortBtn.addEventListener("click", () => {
  order = order === "asc" ? "desc" : "asc";
  syncTools();
  render();
});

function syncTools(){
  shuffleBtn.setAttribute("aria-pressed", String(order === "shuffle"));
  sortBtn.setAttribute("aria-pressed", String(order === "asc" || order === "desc"));
  const desc = order === "desc";
  sortLabel.innerHTML = desc ? "Z&ndash;A" : "A&ndash;Z";
  sortIcon.firstElementChild.setAttribute("d", desc ? ARROW_DOWN : ARROW_UP);
  sortBtn.setAttribute("aria-label",
    desc ? "Sort by place, Z to A" : "Sort by place, A to Z");
}

function ordered(list){
  const by = (a, b) => a.place.localeCompare(b.place, "en", { sensitivity: "base" });
  if (order === "asc")  return [...list].sort(by);
  if (order === "desc") return [...list].sort((a, b) => by(b, a));
  if (order === "shuffle") {
    const seat = d => bag.indexOf(DRINKS.indexOf(d));
    return [...list].sort((a, b) => seat(a) - seat(b));
  }
  return list;
}

function render(){
  const kindOf = active === "All" ? DRINKS : DRINKS.filter(d => d.kind === active);
  const list = ordered(kindOf);

  countEl.textContent =
    list.length + (list.length === 1 ? " cup" : " cups");

  shelf.innerHTML = "";
  list.forEach((d, i) => {
    const li = document.createElement("li");
    li.className = "cup";

    const sub = [d.drink, d.city].filter(Boolean).join(" · ");

    const slug = d.place.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    const panelId = "addr-" + slug;
    const isOpen = opened.has(d.place);
    if (isOpen) li.classList.add("open");

    li.innerHTML = `
      <figure>
        <button class="cupbtn" type="button"
                aria-expanded="${isOpen}" aria-controls="${panelId}">
          <img src="${d.image}" alt="Illustration of a ${d.drink.toLowerCase()} cup from ${d.place}" loading="lazy">
          <figcaption>
            <span class="place">${d.place}</span>
            ${sub ? `<span class="meta">${sub}</span>` : ""}
            ${d.rank ? `<span class="rank">#${d.rank} ${d.kind}</span>` : ""}
            ${d.note ? `<p class="note">${d.note}</p>` : ""}
          </figcaption>
        </button>
        <div class="addr" id="${panelId}">
          <div>${d.address ? `<p><a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(d.place + " " + d.address)}" target="_blank" rel="noopener">${d.address}</a></p>` : ""}</div>
        </div>
      </figure>`;

    if (d.address) {
      const btn = li.querySelector(".cupbtn");
      btn.addEventListener("click", () => {
        const open = li.classList.toggle("open");
        btn.setAttribute("aria-expanded", String(open));
        open ? opened.add(d.place) : opened.delete(d.place);
      });
    }

    shelf.appendChild(li);
  });
}

syncTools();
render();
</script>
</body>
</html>
